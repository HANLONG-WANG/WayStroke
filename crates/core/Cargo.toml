[package]
name = "waystroke-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "process"] }
zbus.workspace = true
waystroke-model.workspace = true
waystroke-protocol.workspace = true
chrono = "0.4"
futures-util = "0.3"
nix = { version = "0.29", features = ["time", "signal", "process"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset"] }
encoding_rs = "0.8"
chrono-tz = "0.10"
shell-words = "1"
glob = "0.3"
getrandom = "0.3"
x11rb = { version = "0.13", features = ["xinput", "xfixes"] }
