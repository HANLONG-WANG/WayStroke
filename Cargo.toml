[workspace]
members = ["crates/model", "crates/protocol", "crates/core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
waystroke-model = { path = "crates/model" }
waystroke-protocol = { path = "crates/protocol" }
